<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>IT Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1020;
            --bg-soft: #121b2d;
            --panel: rgba(17, 24, 39, 0.9);
            --panel-strong: #161f2f;
            --line: rgba(148, 163, 184, 0.22);
            --primary: #5aa7ff;
            --primary-strong: #2f6ef6;
            --purple: #8b5cf6;
            --text: #edf2ff;
            --text-soft: #a7b4d1;
            --success: #34d399;
            --shadow: rgba(15, 23, 42, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(90, 167, 255, 0.18), transparent 26%),
                radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.16), transparent 20%),
                var(--bg);
            color: var(--text);
            display: flex;
        }

        .app-shell {
            width: 100%;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 88px;
            background: rgba(6, 10, 18, 0.95);
            border-left: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 14px;
            gap: 18px;
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: 1px solid transparent;
            background: transparent;
            color: #c9d6f2;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .nav-btn:hover,
        .nav-btn.active {
            background: rgba(90, 167, 255, 0.12);
            border-color: rgba(90, 167, 255, 0.35);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 28px clamp(18px, 4vw, 50px) 24px;
            position: relative;
        }

        .hero {
            width: min(960px, 100%);
            margin: 0 auto;
            text-align: center;
            padding-top: 10px;
        }

        .eyebrow {
            display: inline-flex;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(90, 167, 255, 0.08);
            border: 1px solid rgba(90, 167, 255, 0.2);
            color: var(--primary);
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(2rem, 3.4vw, 3.6rem);
            line-height: 1.2;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-soft);
            font-size: clamp(1rem, 1.3vw, 1.2rem);
            margin-bottom: 26px;
        }

        .prompt-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .prompt-btn {
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(15, 23, 42, 0.7);
            color: var(--text);
            padding: 11px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.96rem;
        }

        .prompt-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(90, 167, 255, 0.45);
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 10px 22px rgba(90, 167, 255, 0.12);
        }

        .prompt-btn strong {
            color: var(--primary);
            margin-left: 6px;
        }

        .chat-box {
            width: min(980px, 100%);
            margin: 18px auto 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding: 12px 4px 10px;
        }

        .image-preview-box {
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .image-preview-box.visible {
            display: flex;
        }

        .preview-item {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: rgba(15, 23, 42, 0.7);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .preview-item span {
            position: absolute;
            right: 6px;
            bottom: 6px;
            background: rgba(15, 23, 42, 0.8);
            color: white;
            padding: 4px 6px;
            border-radius: 999px;
            font-size: 0.7rem;
        }

        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 999px;
        }

        .message {
            max-width: 78%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.7;
            font-size: 1rem;
            box-shadow: 0 10px 25px rgba(2, 6, 23, 0.18);
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(18, 27, 45, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.12);
            color: var(--text);
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: white;
            border-bottom-left-radius: 8px;
        }

        .message.thinking {
            align-self: flex-start;
            background: rgba(18, 27, 45, 0.88);
            border: 1px solid rgba(90, 167, 255, 0.22);
            color: var(--text-soft);
            min-width: 160px;
            width: fit-content;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.25);
        }

        .thinking-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: #dfeaff;
        }

        .thinking-dots {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            height: 18px;
        }

        .thinking-dots span {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
            animation: blinkDots 1.1s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes blinkDots {
            0%, 80%, 100% {
                opacity: 0.25;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-2px);
            }
        }

        .composer {
            width: min(980px, 100%);
            margin: 0 auto;
            padding-top: 8px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 28px;
            box-shadow: 0 16px 35px rgba(2, 6, 23, 0.25);
            overflow: hidden;
        }

        .input-box {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 18px 170px 18px 22px;
            color: var(--text);
            font-size: 1rem;
        }

        .input-box::placeholder {
            color: var(--text-soft);
        }

        .controls {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: rgba(90, 167, 255, 0.09);
            border: 1px solid rgba(90, 167, 255, 0.2);
            border-radius: 12px;
            color: var(--primary);
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.25s ease;
        }

        .upload-btn:hover {
            transform: translateY(-1px);
            background: rgba(90, 167, 255, 0.15);
        }

        .upload-btn input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .model-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(90, 167, 255, 0.1);
            border: 1px solid rgba(90, 167, 255, 0.18);
            color: var(--primary);
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .top-actions {
            position: fixed;
            left: 24px;
            top: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2000;
        }

        .login-btn,
        .plans-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(90, 167, 255, 0.45);
            background: linear-gradient(135deg, rgba(90, 167, 255, 0.2), rgba(47, 110, 246, 0.24));
            color: #ffffff;
            text-decoration: none;
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 12px 24px rgba(90, 167, 255, 0.22);
            white-space: nowrap;
        }

        .plans-btn {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.22), rgba(75, 85, 255, 0.18));
            border-color: rgba(139, 92, 246, 0.45);
        }

        .login-btn:hover,
        .plans-btn:hover {
            transform: translateY(-1px);
            background: rgba(90, 167, 255, 0.2);
        }

        .send-btn {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 20px rgba(90, 167, 255, 0.45);
        }

        .send-btn:hover {
            transform: translateY(-1px) scale(1.02);
        }

        @media (max-width: 720px) {
            .app-shell {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: center;
                border-left: none;
                border-bottom: 1px solid var(--line);
                padding: 14px 12px;
            }

            .main-panel {
                padding-top: 18px;
            }

            .controls {
                left: 10px;
            }

            .input-box {
                padding-left: 10px;
                padding-right: 160px;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="قائمة جانبية">
            <button class="nav-btn active" aria-label="محادثة">✦</button>
            <button class="nav-btn" aria-label="سجل">☰</button>
            <button class="nav-btn" aria-label="إعدادات">⚙</button>
        </aside>

        <main class="main-panel">
            <div class="top-actions" aria-label="أدوات الدخول">
                <a href="/login" class="login-btn" aria-label="تسجيل الدخول">تسجيل الدخول</a>
                <a href="/plans" class="plans-btn" aria-label="الاشتراكات">الاشتراكات</a>
            </div>

            <header class="hero">
                <div class="eyebrow">IT Assistant</div>
                <h1>كيف أقدر أساعدك اليوم؟</h1>
                <p class="subtitle">محادثة ذكية، أفكار جديدة، ومساعدة سريعة في الدروس والمشاريع.</p>

                <div class="prompt-list">
                    <button class="prompt-btn" onclick="sendQuickPrompt('اقترح فكرة مشروع')"><strong>✦</strong> اقترح فكرة</button>
                    <button class="prompt-btn" onclick="sendQuickPrompt('ساعدني في الدرس')"><strong>✦</strong> ساعدني في الدرس</button>
                    <button class="prompt-btn" onclick="sendQuickPrompt('حل مشكل برمجي')"><strong>✦</strong> حل مشكلة</button>
                    <button class="prompt-btn" onclick="sendQuickPrompt('ساعدني ببرمجة')"><strong>✦</strong> مساعدة برمجية</button>
                    <button class="prompt-btn" onclick="sendQuickPrompt('لخص هذا النص')"><strong>✦</strong> تلخيص نص</button>
                </div>
            </header>

            <section class="chat-box" id="chatBox" aria-live="polite">
                <div id="imagePreviewBox" class="image-preview-box" aria-live="polite"></div>
                <div class="message bot">مرحبًا! أنا مساعد IT جاهز لمساعدتك في أفكارك، دروسك، أو مشاكل البرمجة.</div>
            </section>

            <div class="composer">
                <div class="input-wrap">
                    <input id="userInput" type="text" class="input-box" placeholder="اكتب رسالتك هنا..." aria-label="اكتب رسالتك">
                    <div class="controls">
                        <label class="upload-btn" aria-label="رفع صورة">
                            🖼️
                            <input id="imageInput" type="file" accept="image/*" multiple>
                        </label>
                        <span class="model-tag">IT</span>
                        <button class="send-btn" id="sendBtn" aria-label="إرسال">➤</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageInput = document.getElementById('imageInput');
        const imagePreviewBox = document.getElementById('imagePreviewBox');

        function addMessage(text, type) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
            return message;
        }

        function addThinkingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message bot thinking';
            indicator.innerHTML = `
                <span class="thinking-label">
                    جارٍ التفكير
                    <span class="thinking-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </span>
            `;
            chatBox.appendChild(indicator);
            chatBox.scrollTop = chatBox.scrollHeight;
            return indicator;
        }

        function showImagePreview(files) {
            imagePreviewBox.innerHTML = '';

            if (!files || files.length === 0) {
                imagePreviewBox.classList.remove('visible');
                return;
            }

            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;

                const item = document.createElement('div');
                item.className = 'preview-item';

                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.alt = file.name;

                const name = document.createElement('span');
                name.textContent = file.name.length > 8 ? file.name.slice(0, 8) + '...' : file.name;

                item.appendChild(img);
                item.appendChild(name);
                imagePreviewBox.appendChild(item);
            });

            imagePreviewBox.classList.add('visible');
        }

        async function sendMessage() {
            const value = userInput.value.trim();
            const selectedFiles = [...(imageInput.files || [])].filter(file => file && file.type && file.type.startsWith('image/'));

            if (!value && selectedFiles.length === 0) {
                userInput.focus();
                return;
            }

            if (value) {
                addMessage(value, 'user');
            }

            if (selectedFiles.length > 0) {
                const names = selectedFiles.map(file => file.name).join(', ');
                addMessage(`تم رفع الصورة: ${names}`, 'user');
            }

            userInput.value = '';
            imageInput.value = '';
            showImagePreview([]);

            const thinkingMessage = addThinkingIndicator();

            try {
                const formData = new FormData();
                if (value) {
                    formData.append('message', value);
                }
                selectedFiles.forEach(file => formData.append('images', file));

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    body: formData
                });

                let data = {};
                try {
                    const text = await response.text();
                    data = text ? JSON.parse(text) : {};
                } catch (parseError) {
                    data = {};
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const reply = data.reply || 'عذراً، لم أتمكن من توليد إجابة مناسبة.';

                await new Promise(resolve => setTimeout(resolve, 1200));
                thinkingMessage.remove();
                addMessage(reply, 'bot');
            } catch (error) {
                await new Promise(resolve => setTimeout(resolve, 600));
                thinkingMessage.remove();
                addMessage('حدثت مشكلة في الاتصال بالخادم. حاول مرة أخرى.', 'bot');
            }
        }

        function sendQuickPrompt(prompt) {
            userInput.value = prompt;
            sendMessage();
        }

        imageInput.addEventListener('change', function () {
            showImagePreview([...imageInput.files]);
        });

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
