<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | IT Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1020;
            --panel: rgba(17, 24, 39, 0.9);
            --line: rgba(148, 163, 184, 0.22);
            --primary: #5aa7ff;
            --primary-strong: #2f6ef6;
            --text: #edf2ff;
            --text-soft: #a7b4d1;
            --danger: #fb7185;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top right, rgba(90, 167, 255, 0.2), transparent 28%),
                radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.14), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: 'Tajawal', sans-serif;
        }

        .login-shell {
            width: min(440px, calc(100% - 28px));
            background: rgba(17, 24, 39, 0.88);
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: 0 26px 70px rgba(2, 6, 23, 0.45);
            padding: 34px 28px 28px;
            backdrop-filter: blur(8px);
        }

        .brand {
            text-align: center;
            margin-bottom: 18px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 62px;
            height: 62px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            font-size: 1.7rem;
            margin-bottom: 10px;
            box-shadow: 0 14px 28px rgba(47, 110, 246, 0.4);
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            line-height: 1.3;
        }

        .sub {
            text-align: center;
            color: var(--text-soft);
            margin: 6px 0 24px;
            font-size: 0.95rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: var(--text-soft);
            font-size: 0.9rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(15, 23, 42, 0.7);
            color: var(--text);
            border-radius: 14px;
            padding: 15px 16px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: rgba(90, 167, 255, 0.6);
            box-shadow: 0 0 0 4px rgba(90, 167, 255, 0.12);
        }

        .error {
            background: rgba(251, 113, 133, 0.12);
            border: 1px solid rgba(251, 113, 133, 0.25);
            color: #ffd6dd;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.86rem;
        }

        button {
            margin-top: 8px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: white;
            font-size: 1rem;
            font-weight: 700;
            padding: 16px 18px;
            cursor: pointer;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            box-shadow: 0 16px 28px rgba(47, 110, 246, 0.35);
        }

        button:hover {
            transform: translateY(-1px);
        }

        .helper {
            margin-top: 18px;
            text-align: center;
            color: var(--text-soft);
            font-size: 0.82rem;
        }

        .helper a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="brand">
            <div class="brand-badge">IT</div>
            <h1>إنشاء حساب</h1>
        </div>

        <p class="sub">أنشئ حسابك الآن للوصول إلى مساعد IT</p>

        <form method="POST" action="/register">
            <div class="field">
                <label for="username">اسم المستخدم</label>
                <input id="username" name="username" type="text" placeholder="اختر اسم مستخدم" required>
            </div>

            <div class="field">
                <label for="password">كلمة المرور</label>
                <input id="password" name="password" type="password" placeholder="اكتب كلمة المرور" required>
            </div>

            <div class="field">
                <label for="confirm_password">تأكيد كلمة المرور</label>
                <input id="confirm_password" name="confirm_password" type="password" placeholder="أعد كتابة كلمة المرور" required>
            </div>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <button type="submit">إنشاء الحساب</button>
        </form>

        <div class="helper">
            لديك حساب بالفعل؟
            <a href="/login">تسجيل الدخول</a>
        </div>
    </div>
</body>
</html>
